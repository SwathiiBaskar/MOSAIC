# Dependency policy enforced by `cargo deny check`.
# The accepted licences, sources and bans below are recorded with their
# rationale in docs/deps.md.

[graph]
# Only the platforms MOSAIC supports take part in the checks, so crates that
# are compiled exclusively for other platforms are out of scope.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# First-party crates carry no licence expression and are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

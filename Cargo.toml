[workspace]
resolver = "3"
members = ["crates/mosaic-core", "crates/mosaic-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
getrandom = "0.4"
proptest = "1.11"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
